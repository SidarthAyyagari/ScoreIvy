# Render Blueprint: creates the database, backend, student site, and admin site.
# Values marked `sync: false` are entered in the Render dashboard on first deploy (never committed).
# See DEPLOY.md.

databases:
  - name: scoreivy-db
    plan: 0.1c-256mb
    region: virginia
    databaseName: scoreivy
    user: scoreivy
    postgresMajorVersion: "15"

services:
  - type: web
    name: scoreivy-api
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    buildFilter:
      paths: [backend/**, database/**]
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scoreivy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CORS_ORIGINS
        value: https://scoreivy.com,https://www.scoreivy.com,https://admin.scoreivy.com
      - key: FRONTEND_URL
        value: https://scoreivy.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  - type: web
    name: scoreivy-web
    runtime: node
    plan: 0.5c-512mb
    region: virginia
    rootDir: ui_user
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: https://api.scoreivy.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_DESMOS_API_KEY
        sync: false

  - type: web
    name: scoreivy-admin
    runtime: node
    plan: 0.5c-512mb
    region: virginia
    rootDir: ui_admin
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: https://api.scoreivy.com
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_REQUIRE_ADMIN
        value: "true"
